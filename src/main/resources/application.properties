spring.application.name=educacionparatodos

# ---- Base de datos ----
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/educacion_para_todos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# ---- Servidor ----
server.port=${PORT:8080}

# ---- JWT ----
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-produccion}
jwt.expiration=3600000

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
# ---- IA: Gemini (HU-105) ----
# La key se lee SOLO de la variable de entorno GEMINI_API_KEY: nunca se escribe
# aqui ni llega al frontend. Si no esta definida, el endpoint responde 503 con
# un mensaje para el docente en vez de fallar al arrancar.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}
