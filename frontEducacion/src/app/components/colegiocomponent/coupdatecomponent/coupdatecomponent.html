<div class="container">
  <h2>Formulario de Actualizacion de Colegios</h2>

  @if (formColegio) {
    <form [formGroup]="formColegio" (ngSubmit)="actualizarColegio()">
      <mat-form-field appearance="outline">
        <mat-label>Nombre del colegio</mat-label>
        <input matInput type="text" formControlName="nombre" placeholder="I.E. Jose Carlos Mariategui" />
        <mat-error>Nombre del colegio es obligatorio</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Direccion</mat-label>
        <input matInput type="text" formControlName="direccion" placeholder="Av. Los Heroes 123" />
        <mat-error>Direccion es obligatorio</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Distrito</mat-label>
        <input matInput type="text" formControlName="distrito" placeholder="San Juan de Miraflores" />
        <mat-error>Distrito es obligatorio</mat-error>
      </mat-form-field>

      <button mat-flat-button type="submit">Guardar</button>
    </form>
  }

  @if (mensaje) {
    <p>{{ mensaje }}</p>
  }
</div>
