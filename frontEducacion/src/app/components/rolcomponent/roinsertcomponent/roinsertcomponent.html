<div class="container">
  <h2>Registro de Rol</h2>

  <form [formGroup]="formRol" (ngSubmit)="insertarRol()">
      <mat-form-field appearance="outline">
        <mat-label>Nombre del rol</mat-label>
        <input matInput type="text" formControlName="nombre" placeholder="DOCENTE" />
        <mat-error>Nombre del rol es obligatorio</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descripcion</mat-label>
        <input matInput type="text" formControlName="descripcion" placeholder="Profesor a cargo de un aula" />
      </mat-form-field>

    <button mat-flat-button type="submit">Registrar</button>
  </form>

  @if (mensaje) {
    <p>{{ mensaje }}</p>
  }
</div>
