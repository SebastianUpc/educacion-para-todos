<div class="container">
  <h2>Formulario de Actualizacion de Evaluaciones</h2>

  @if (formEvaluacion) {
    <form [formGroup]="formEvaluacion" (ngSubmit)="actualizarEvaluacion()">
      <mat-form-field appearance="outline">
        <mat-label>Estudiante</mat-label>
        <mat-select formControlName="idEstudiante">
          @for (op of listaUsuario; track op.id) {
            <mat-option [value]="op.id">
              {{ op.id }} - {{ op.nombre }}
            </mat-option>
          }
        </mat-select>
        <mat-error>Estudiante es obligatorio</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Estado</mat-label>
        <mat-select formControlName="estado">
          @for (op of opcionesEstado; track op.value) {
            <mat-option [value]="op.value">{{ op.viewValue }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button mat-flat-button type="submit">Guardar</button>
    </form>
  }

  @if (mensaje) {
    <p>{{ mensaje }}</p>
  }
</div>
