<mat-toolbar>
  <button mat-icon-button routerLink="/" aria-label="Inicio">
    <mat-icon>home</mat-icon>
  </button>

  <span class="titulo">Educacion para Todos</span>

  @if (logueado) {
    <div class="menus">
        <button mat-button [matMenuTriggerFor]="menuColegio" [class.activo]="seccionActiva('/colegio')">Colegios</button>
        <mat-menu #menuColegio="matMenu">
          <button mat-menu-item routerLink="/colegio/listar">Listar</button>
          @if (esAdmin) {
            <button mat-menu-item routerLink="/colegio/insertar">Insertar</button>
          }
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="menuAula" [class.activo]="seccionActiva('/aula')">Aulas</button>
        <mat-menu #menuAula="matMenu">
          <button mat-menu-item routerLink="/aula/listar">Listar</button>
          @if (gestiona) {
            <button mat-menu-item routerLink="/aula/insertar">Insertar</button>
          }
        </mat-menu>

        @if (esAdmin) {
          <button mat-button [matMenuTriggerFor]="menuRol" [class.activo]="seccionActiva('/rol')">Roles</button>
          <mat-menu #menuRol="matMenu">
            <button mat-menu-item routerLink="/rol/listar">Listar</button>
            <button mat-menu-item routerLink="/rol/insertar">Insertar</button>
          </mat-menu>
        }

        <button mat-button [matMenuTriggerFor]="menuTema" [class.activo]="seccionActiva('/tema')">Temas</button>
        <mat-menu #menuTema="matMenu">
          <button mat-menu-item routerLink="/tema/listar">Listar</button>
          @if (gestiona) {
            <button mat-menu-item routerLink="/tema/insertar">Insertar</button>
          }
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="menuEjercicio" [class.activo]="seccionActiva('/ejercicio')">Ejercicios</button>
        <mat-menu #menuEjercicio="matMenu">
          <button mat-menu-item routerLink="/ejercicio/listar">Listar</button>
          @if (gestiona) {
            <button mat-menu-item routerLink="/ejercicio/insertar">Insertar</button>
          }
        </mat-menu>

        @if (gestiona) {
          <button mat-button [matMenuTriggerFor]="menuUsuario" [class.activo]="seccionActiva('/usuario')">Usuarios</button>
          <mat-menu #menuUsuario="matMenu">
            <button mat-menu-item routerLink="/usuario/listar">Listar</button>
            <button mat-menu-item routerLink="/usuario/insertar">Insertar</button>
            <button mat-menu-item routerLink="/usuario/buscar">Buscar</button>
          </mat-menu>
        }

        <button mat-button [matMenuTriggerFor]="menuEvaluacion" [class.activo]="seccionActiva('/evaluacion')">Evaluaciones</button>
        <mat-menu #menuEvaluacion="matMenu">
          <button mat-menu-item routerLink="/evaluacion/listar">Listar</button>
          <button mat-menu-item routerLink="/evaluacion/buscar">Buscar</button>
          @if (gestiona) {
            <button mat-menu-item routerLink="/evaluacion/insertar">Insertar</button>
            <button mat-menu-item routerLink="/evaluacion/historial">Historial por estudiante</button>
          }
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="menuProgreso" [class.activo]="seccionActiva('/progreso')">Progresos</button>
        <mat-menu #menuProgreso="matMenu">
          <button mat-menu-item routerLink="/progreso/listar">Listar</button>
        </mat-menu>

        <button mat-button [matMenuTriggerFor]="menuDetalleevaluacion" [class.activo]="seccionActiva('/detalle-evaluacion')">Detalles de evaluacion</button>
        <mat-menu #menuDetalleevaluacion="matMenu">
          <button mat-menu-item routerLink="/detalle-evaluacion/listar">Listar</button>
        </mat-menu>
        @if (gestiona) {
          <button mat-button [matMenuTriggerFor]="menuReporte" [class.activo]="seccionActiva('/reportes')">Reportes</button>
          <mat-menu #menuReporte="matMenu">
            <button mat-menu-item routerLink="/reportes/reporte01">Colegios por distrito</button>
            <button mat-menu-item routerLink="/reportes/reporte02">Aulas por colegio</button>
            <button mat-menu-item routerLink="/reportes/reporte03">Usuarios por rol</button>
            <button mat-menu-item routerLink="/reportes/reporte04">Evaluaciones por estudiante</button>
          </mat-menu>
        }
    </div>
  }

  <span class="spacer"></span>

  @if (logueado) {
    <span class="usuario">{{ usuario }}</span>
    <button mat-icon-button (click)="salir()" aria-label="Salir">
      <mat-icon>logout</mat-icon>
    </button>
  } @else {
    <button mat-button routerLink="/login">Iniciar sesion</button>
  }
</mat-toolbar>
