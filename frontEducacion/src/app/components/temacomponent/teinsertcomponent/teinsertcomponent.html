<div class="container">
  <h2>Registro de Tema</h2>

  <form [formGroup]="formTema" (ngSubmit)="insertarTema()">
      <mat-form-field appearance="outline">
        <mat-label>Materia</mat-label>
        <input matInput type="text" formControlName="materia" placeholder="Matematica" />
        <mat-error>Materia es obligatorio</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Nombre del tema</mat-label>
        <input matInput type="text" formControlName="nombre" placeholder="Fracciones" />
        <mat-error>Nombre del tema es obligatorio</mat-error>
      </mat-form-field>

    <button mat-flat-button type="submit">Registrar</button>
  </form>

  @if (mensaje) {
    <p>{{ mensaje }}</p>
  }
</div>
